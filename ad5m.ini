# FlashForge Adventurer 5M — PrusaSlicer CLI base profile
# 220 x 220 x 220 mm, 0.4 mm nozzle, 1.75 mm filament.
# Quality, infill and support settings are overridden per job by the add-on.

# --- machine ---
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 220
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = marlin2
use_relative_e_distances = 0
single_extruder_multi_material = 0

# --- default temperatures (PLA) ---
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60

# --- layers ---
layer_height = 0.2
first_layer_height = 0.25

# --- shells ---
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
extra_perimeters = 0

# --- infill ---
fill_density = 15%
fill_pattern = grid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic

# --- speed (conservative for a Klipper-based core XY) ---
perimeter_speed = 120
external_perimeter_speed = 80
infill_speed = 160
solid_infill_speed = 140
top_solid_infill_speed = 90
travel_speed = 300
first_layer_speed = 25
bridge_speed = 60
gap_fill_speed = 60

# --- acceleration ---
default_acceleration = 5000
first_layer_acceleration = 1000
perimeter_acceleration = 3000
infill_acceleration = 5000
travel_acceleration = 8000

# --- retraction (direct drive) ---
retract_length = 0.8
retract_speed = 40
deretract_speed = 30
retract_lift = 0.2
retract_before_travel = 2
wipe = 1

# --- cooling ---
fan_always_on = 1
cooling = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 1
slowdown_below_layer_time = 8
min_print_speed = 15

# --- adhesion ---
skirts = 1
skirt_distance = 3
skirt_height = 1
brim_width = 0

# --- supports (off by default, switched on per job) ---
support_material = 0
support_material_auto = 1
support_material_threshold = 55
support_material_contact_distance = 0.2
support_material_spacing = 2.5
support_material_buildplate_only = 0

# --- output ---
gcode_comments = 0
complete_objects = 0

# --- start / end gcode ---
# Heat the bed and nozzle, home, then lay a prime line along the front edge.
start_gcode = M140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 Z2.0 F1200\nG1 X5 Y10 Z0.28 F6000\nG1 X5 Y200 Z0.28 E18 F1500\nG1 X5.6 Y200 Z0.28 F6000\nG1 X5.6 Y10 Z0.28 E36 F1500\nG92 E0\nG1 Z2.0 F1200

end_gcode = M104 S0\nM140 S0\nG92 E0\nG1 E-3 F1800\nG1 Z{max_print_height/2 < z ? z + 2 : max_print_height/2} F1200\nG28 X Y\nM107\nM84
